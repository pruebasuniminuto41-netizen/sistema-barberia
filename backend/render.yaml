services:
  - type: web
    name: barberia-backend
    env: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader && php artisan key:generate && php artisan migrate --force --seed
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: barberia-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: barberia-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: barberia-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: barberia-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: barberia-db
          property: password

databases:
  - name: barberia-db
    databaseName: barberia_db_4g16
    user: barberia_db_4g16_user
